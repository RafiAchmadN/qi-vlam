name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install + unit tests
        run: |
          npm ci
          npm test
      - name: Build web app
        run: npm run build
      - name: Generate Android project (Capacitor)
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../qi-vla-robot-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qi-vla-robot-apk
          path: app/qi-vla-robot-debug.apk
      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/qi-vla-robot-debug.apk
