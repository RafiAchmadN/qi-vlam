name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install + unit tests
        run: |
          npm ci
          npm test
      - name: Build web app
        run: npm run build
      - name: Generate Android project (Capacitor)
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../qi-vla-robot-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: qi-vla-robot-apk
          path: app/qi-vla-robot-debug.apk
      - name: Release notes from CHANGELOG.md (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: |
          awk -v tag="## ${GITHUB_REF_NAME} " 'index($0, tag) == 1 {on=1; next} /^## v/ {on=0} on' CHANGELOG.md > release_notes.md
          test -s release_notes.md || echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          head -5 release_notes.md
      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: app/qi-vla-robot-debug.apk
