[project]
name = "qi-vla"
version = "2.0.0"
description = "Quantum-inspired tensor-network compression, quantum policy heads and Lyapunov safety for Vision-Language-Action models, with an open robot app"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "fastapi", "uvicorn", "pydantic"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "isort", "mypy"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
